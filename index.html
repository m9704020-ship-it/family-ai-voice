function getToken() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "geminiTokenCallback_" + Date.now();

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("인증 토큰 요청 시간 초과"));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = (result) => {
      cleanup();

      if (!result || !result.token) {
        reject(new Error("인증 토큰을 받지 못했습니다."));
        return;
      }

      resolve(result.token);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("인증 서버 연결 실패"));
    };

    script.src =
      GAS_URL +
      "?action=token&callback=" +
      callbackName;

    document.body.appendChild(script);
  });
}

function floatToPCM16(float32) {
  const output = new Int16Array(float32.length);

  for (let i = 0; i < float32.length; i++) {
    const sample = Math.max(-1, Math.min(1, float32[i]));

    output[i] =
      sample < 0
        ? sample * 32768
        : sample * 32767;
  }

  return output;
}

function downsample(input, inputRate, outputRate) {
  if (inputRate === outputRate) return input;

  const ratio = inputRate / outputRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const position = i * ratio;
    const left = Math.floor(position);
    const right = Math.min(left + 1, input.length - 1);
    const fraction = position - left;

    output[i] =
      input[left] * (1 - fraction) +
      input[right] * fraction;
  }

  return output;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes.buffer;
}

function playAudio(base64) {
  if (!audioContext) return;

  const pcmBuffer = base64ToArrayBuffer(base64);
  const pcm = new Int16Array(pcmBuffer);

  const audioBuffer =
    audioContext.createBuffer(
      1,
      pcm.length,
      24000
    );

  const channel = audioBuffer.getChannelData(0);

  for (let i = 0; i < pcm.length; i++) {
    channel[i] = pcm[i] / 32768;
  }

  const source = audioContext.createBufferSource();

  source.buffer = audioBuffer;
  source.connect(audioContext.destination);

  const startTime = Math.max(
    audioContext.currentTime,
    nextPlayTime
  );

  source.start(startTime);

  nextPlayTime = startTime + audioBuffer.duration;
}

          }

          const requestId =
            Date.now().toString() +
            Math.random().toString(36).slice(2);

          const results = await new Promise((resolve, reject) => {

            const timeout = setTimeout(() => {
              cleanup();
              reject(new Error("관광정보 검색 시간이 초과되었습니다."));
            }, 30000);

            function cleanup() {
              clearTimeout(timeout);
              window.removeEventListener("daon-tour-search-results", onResults);
              window.removeEventListener("daon-tour-search-error", onError);
            }

            function onResults(event) {
              if (event.detail.requestId !== requestId) return;
              cleanup();
              resolve(event.detail.results || []);
            }

            function onError(event) {
              if (event.detail.requestId !== requestId) return;
              cleanup();
              reject(new Error(event.detail.error || "관광정보 검색 실패"));
            }

            window.addEventListener("daon-tour-search-results", onResults);
            window.addEventListener("daon-tour-search-error", onError);

            window.opener.postMessage({
              type: "DAON_TOUR_SEARCH_REQUEST",
              requestId: requestId,
              keyword: keyword,
              areaCode: areaCode
            }, "https://script.google.com");

async function startMicrophone() {

  microphoneStream =
    await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

  microphoneSource =
    audioContext.createMediaStreamSource(
      microphoneStream
    );

  processor =
    audioContext.createScriptProcessor(
      4096, 1, 1
    );

  processor.onaudioprocess = (event) => {

    if (
      !socket ||
      socket.readyState !== WebSocket.OPEN ||
      !isRunning
    ) return;

    const input =
      event.inputBuffer.getChannelData(0);

    const reduced =
      downsample(
        input,
        audioContext.sampleRate,
        16000
      );

    const pcm = floatToPCM16(reduced);

    socket.send(JSON.stringify({
      realtimeInput: {
        audio: {
          mimeType: "audio/pcm;rate=16000",
          data: arrayBufferToBase64(pcm.buffer)
        }
      }
    }));
  };

  microphoneSource.connect(processor);
  processor.connect(audioContext.destination);
}

    await startMicrophone();

stopButton.disabled = false;

  } catch (error) {

    console.error(error);

    setStatus("연결 오류: " + error.message);

}

function stopConversation() {

  isRunning = false;

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (microphoneSource) {
    microphoneSource.disconnect();
    microphoneSource = null;
  }

  if (microphoneStream) {
    microphoneStream.getTracks().forEach(
      track => track.stop()
    );
    microphoneStream = null;
  }

  if (socket) {
    socket.close();
    socket = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  nextPlayTime = 0;

  startButton.disabled = false;
  stopButton.disabled = true;

  setStatus("대화가 종료되었습니다.");
}

startButton.addEventListener(

);

stopButton.addEventListener(
