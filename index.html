
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 가족 AI 친구 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #243047;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px #00000012;
      text-align: center;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      line-height: 1.7;
    }

    .character {
  margin: 25px 0;
}

.character img {
  width: 240px;
  max-width: 85%;
  height: auto;
  display: block;
  margin: 0 auto;
  border-radius: 18px;
  animation: daonFloat 2.5s ease-in-out infinite;
}

@keyframes daonFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

    .status {
      padding: 15px;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      margin: 20px 0;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 25px;
      margin: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #2563eb;
      color: white;
    }

    #stopButton {
      background: #e2e8f0;
      color: #334155;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .conversation {
      text-align: left;
      margin-top: 25px;
      padding: 18px;
      min-height: 150px;
      background: #f8fafc;
      border-radius: 14px;
      white-space: pre-wrap;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .notice {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>우리 가족 AI 친구</h1>

    <div class="description">
      언제든 편하게 이야기할 수 있는<br>
      우리 가족만의 따뜻한 AI 친구입니다.
    </div>

    <div class="character">
  <img src="daon-animated.gif" alt="다온이">
</div>

    <div id="status" class="status">
      음성 연결 준비 완료
    </div>

    <button id="startButton">
      🎙️ 대화 시작
    </button>

    <button id="stopButton" disabled>
      ⏹️ 대화 종료
    </button>

    <div class="conversation" id="conversation">
      대화 내용이 여기에 표시됩니다.
    </div>

    <div class="notice" id="micNotice">
  마이크 사용 권한을 허용해 주세요.
</div>

  </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxT7Aar_8GmKmG78MF--Z_ZPo20V4J4O7Sjn5CHCPkkFi6scPXaCirnbPgz6NwU8GFv/exec";

const MODEL = "gemini-3.8-live";

let socket = null;
let audioContext = null;
let microphoneStream = null;
let processor = null;
let microphoneSource = null;

let nextPlayTime = 0;
let isRunning = false;

const statusElement = document.getElementById("status");
const conversationElement = document.getElementById("conversation");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const micNotice = document.getElementById("micNotice");
// 가족 플래너 일정 수신
let familyScheduleContext = "";
let familyScheduleReady = false;

window.addEventListener("message", (event) => {

  if (!window.opener || event.source !== window.opener) return;

  const trustedOrigin =
    event.origin === "https://script.google.com" ||
    event.origin.endsWith(".googleusercontent.com");

  if (!trustedOrigin) return;

  if (
    !event.data ||
    event.data.type !== "FAMILY_PLANNER_DATA"
  ) return;

  familyScheduleContext = JSON.stringify(event.data.payload);
  familyScheduleReady = true;

  console.log("가족 플래너 일정 수신 완료:", event.data.payload);

  const payload = event.data.payload;

  const calendarCount =
    Array.isArray(payload.calendarEvents)
      ? payload.calendarEvents.length
      : 0;

  const personalCount =
    Array.isArray(payload.items)
      ? payload.items.length
      : 0;

  const sharedCount =
    Array.isArray(payload.shared)
      ? payload.shared.length
      : 0;

  setStatus(
    `가족 일정 수신 완료! 개인 ${personalCount}개 · 공동 ${sharedCount}개 · Google 캘린더 ${calendarCount}개 😊`
  );

});
 

// 가족 플래너에 연결 준비 완료 신호 보내기
window.addEventListener("load", () => {

  if (!window.opener) {
  setStatus("가족 플래너 창을 찾을 수 없습니다. 😢");
  return;
}

setStatus("가족 플래너 창 확인 완료! 연결 신호 전송 중...");

  let count = 0;

  const sendReady = () => {
    window.opener.postMessage(
      { type: "DAON_READY" },
      "*"
    );

    count++;

    if (count >= 20) {
      clearInterval(readyTimer);
    }
  };

  sendReady();

  const readyTimer = setInterval(sendReady, 500);

});

function setStatus(message) {
  statusElement.textContent = message;
}

function addConversation(message) {
  conversationElement.textContent += "\n" + message;
  conversationElement.scrollTop =
    conversationElement.scrollHeight;
}

function getToken() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "geminiTokenCallback_" + Date.now();

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("인증 토큰 요청 시간 초과"));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = (result) => {
      cleanup();

      if (!result || !result.token) {
        reject(new Error("인증 토큰을 받지 못했습니다."));
        return;
      }

      resolve(result.token);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("인증 서버 연결 실패"));
    };

    script.src =
      GAS_URL +
      "?action=token&callback=" +
      callbackName;

    document.body.appendChild(script);
  });
}

function floatToPCM16(float32) {
  const output = new Int16Array(float32.length);

  for (let i = 0; i < float32.length; i++) {
    const sample = Math.max(-1, Math.min(1, float32[i]));

    output[i] =
      sample < 0
        ? sample * 32768
        : sample * 32767;
  }

  return output;
}

function downsample(input, inputRate, outputRate) {
  if (inputRate === outputRate) return input;

  const ratio = inputRate / outputRate;
  const outputLength = Math.floor(input.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const position = i * ratio;
    const left = Math.floor(position);
    const right = Math.min(left + 1, input.length - 1);
    const fraction = position - left;

    output[i] =
      input[left] * (1 - fraction) +
      input[right] * fraction;
  }

  return output;
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes.buffer;
}

function playAudio(base64) {
  if (!audioContext) return;

  const pcmBuffer = base64ToArrayBuffer(base64);
  const pcm = new Int16Array(pcmBuffer);

  const audioBuffer =
    audioContext.createBuffer(
      1,
      pcm.length,
      24000
    );

  const channel = audioBuffer.getChannelData(0);

  for (let i = 0; i < pcm.length; i++) {
    channel[i] = pcm[i] / 32768;
  }

  const source = audioContext.createBufferSource();

  source.buffer = audioBuffer;
  source.connect(audioContext.destination);

  const startTime = Math.max(
    audioContext.currentTime,
    nextPlayTime
  );

  source.start(startTime);

  nextPlayTime = startTime + audioBuffer.duration;
}

function connectGemini(token) {
  return new Promise((resolve, reject) => {

    const url =
      "wss://generativelanguage.googleapis.com/ws/" +
      "google.ai.generativelanguage.v1beta." +
      "GenerativeService.BidiGenerateContentConstrained" +
      "?access_token=" + encodeURIComponent(token);

    socket = new WebSocket(url);

    socket.onopen = () => {

      socket.send(JSON.stringify({
        setup: {
          model: "models/" + MODEL,

          generationConfig: {
            responseModalities: ["AUDIO"]
          },

          systemInstruction: {
            parts: [{
              
text:
  "당신은 우리 가족의 따뜻하고 친근한 AI 친구 다온입니다. " +
  "한국어로 자연스럽고 다정하게 대화하세요. " +
  "창화, 여은, 윤이와 편안하게 이야기하세요. " +
  "상대방의 말을 잘 듣고 친근하고 짧게 답변하세요. " +

  "다음은 가족 플래너에서 전달된 실제 일정 데이터입니다. " +
  "개인 일정, 가족 공동 일정, Google 캘린더 일정을 구분해서 이해하세요. " +
  "Google 캘린더에는 개인 캘린더, 가족 캘린더, 대한민국의 휴일이 포함될 수 있습니다. " +

  (familyScheduleContext || "아직 가족 일정 정보가 전달되지 않았습니다.") +

  "가족이 일정에 관해 질문하면 전달된 데이터를 확인하여 답변하세요. " +
  "날짜, 요일, 시간, 일정 내용, 담당자, 캘린더 종류를 가능한 정확하게 알려주세요. " +
  "calendarName이 가족이면 가족 캘린더 일정으로, 대한민국의 휴일이면 공휴일로 안내하세요. " +
  "종일 일정은 종일 일정이라고 알려주세요. " +
  "이번 주, 다음 주, 주말 등의 질문은 전달된 날짜 정보를 기준으로 판단하세요. " +
  "여러 일정이 있으면 날짜순으로 정리해서 알려주세요. " +
  "일정에 없는 내용은 절대로 추측하지 마세요. " +
  "정보가 부족하거나 전달된 일정에 없는 날짜라면 확인할 수 없다고 솔직하게 말하세요. " +
  "일정을 단순히 나열하기보다 가족이 이해하기 쉽게 자연스럽게 설명하세요. " +
"날씨를 물어보면 반드시 get_weather 기능을 사용하여 실제 날씨를 확인하세요. " +
"기본 날씨 조회 지역은 부산 사하구 다대동입니다. " +
"조회한 기온, 체감온도, 습도, 강수량, 풍속을 이해하기 쉽게 한국어로 설명하세요. " +
            }]
          },
tools: [{
  functionDeclarations: [{
    name: "get_weather",
    description: "부산 사하구 다대동 또는 사용자가 요청한 지역의 실시간 날씨와 예보를 조회합니다.",
    parameters: {
      type: "OBJECT",
      properties: {
        location: {
          type: "STRING",
          description: "날씨를 조회할 지역"
        }
      },
      required: ["location"]
    }
  }]
}],
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));
    };

    
socket.onmessage = async (event) => {

  let message = event.data;

  if (message instanceof Blob) {
    message = await message.text();
  }

  if (message instanceof ArrayBuffer) {
    message = new TextDecoder().decode(message);
  }

  const data = JSON.parse(message);
// 다온이의 날씨 조회 함수 처리
if (data.toolCall?.functionCalls) {

  const functionResponses = [];

  for (const call of data.toolCall.functionCalls) {

    if (call.name === "get_weather") {

      try {
        const location =
          call.args?.location || "부산 사하구 다대동";

        // 지역 검색
        const geoUrl =
          "https://geocoding-api.open-meteo.com/v1/search" +
          "?name=" + encodeURIComponent(location) +
          "&count=1&language=ko&format=json";

        const geoResponse = await fetch(geoUrl);
        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("지역을 찾을 수 없습니다.");
        }

        const place = geoData.results[0];

        // 현재 날씨 조회
        const weatherUrl =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=" + place.latitude +
          "&longitude=" + place.longitude +
          "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m" +
          "&timezone=Asia%2FSeoul";

        const weatherResponse = await fetch(weatherUrl);
        const weatherData = await weatherResponse.json();

        functionResponses.push({
          id: call.id,
          name: call.name,
          response: {
            result: {
              location: place.name,
              temperature: weatherData.current.temperature_2m,
              feelsLike: weatherData.current.apparent_temperature,
              humidity: weatherData.current.relative_humidity_2m,
              precipitation: weatherData.current.precipitation,
              weatherCode: weatherData.current.weather_code,
              windSpeed: weatherData.current.wind_speed_10m
            }
          }
        });

      } catch (error) {

        functionResponses.push({
          id: call.id,
          name: call.name,
          response: {
            error: error.message
          }
        });

      }
    }
  }

  if (functionResponses.length > 0) {
    socket.send(JSON.stringify({
      toolResponse: {
        functionResponses: functionResponses
      }
    }));
  }
}

      if (data.setupComplete) {
        setStatus("연결 완료! 편하게 이야기하세요 😊");
        resolve();
      }

      const serverContent = data.serverContent;

      if (serverContent) {

        if (serverContent.inputTranscription?.text) {
          addConversation(
            "나: " + serverContent.inputTranscription.text
          );
        }

        if (serverContent.outputTranscription?.text) {
          addConversation(
            "AI: " + serverContent.outputTranscription.text
          );
        }

        const parts =
          serverContent.modelTurn?.parts || [];

        for (const part of parts) {
          if (part.inlineData?.data) {
            playAudio(part.inlineData.data);
          }
        }

        if (serverContent.turnComplete) {
          setStatus("듣고 있어요. 계속 이야기해 주세요.");
        }
      }

      if (data.error) {
        reject(new Error(
          data.error.message || "Gemini 연결 오류"
        ));
      }
    };

    socket.onerror = () => {
      reject(new Error("음성 서버 연결 오류"));
    };

    socket.onclose = () => {
      if (isRunning) {
        setStatus("연결이 종료되었습니다.");
      }
    };
  });
}

async function startMicrophone() {

  microphoneStream =
    await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

  microphoneSource =
    audioContext.createMediaStreamSource(
      microphoneStream
    );

  processor =
    audioContext.createScriptProcessor(
      4096, 1, 1
    );

  processor.onaudioprocess = (event) => {

    if (
      !socket ||
      socket.readyState !== WebSocket.OPEN ||
      !isRunning
    ) return;

    const input =
      event.inputBuffer.getChannelData(0);

    const reduced =
      downsample(
        input,
        audioContext.sampleRate,
        16000
      );

    const pcm = floatToPCM16(reduced);

    socket.send(JSON.stringify({
      realtimeInput: {
        audio: {
          mimeType: "audio/pcm;rate=16000",
          data: arrayBufferToBase64(pcm.buffer)
        }
      }
    }));
  };

  microphoneSource.connect(processor);
  processor.connect(audioContext.destination);
}

async function startConversation() {

  try {

    if (!familyScheduleReady) {
      setStatus("가족 플래너에서 일정을 받는 중입니다. 잠시 기다려 주세요.");
      startButton.disabled = false;
      return;
    }

    startButton.disabled = true;

    setStatus("인증 토큰 확인 중...");

    audioContext = new AudioContext();

    await audioContext.resume();

    const token = await getToken();

    setStatus("Gemini 음성 서버 연결 중...");

    await connectGemini(token);

    isRunning = true;

    await startMicrophone();

if (micNotice) {
  micNotice.style.display = "none";
}

startButton.disabled = true;
stopButton.disabled = false;

addConversation("🎙️ 대화를 시작했습니다.");

    startButton.disabled = true;
    stopButton.disabled = false;

    addConversation("🎙️ 대화를 시작했습니다.");

  } catch (error) {

    console.error(error);

    setStatus("연결 오류: " + error.message);

    stopConversation();

  }
}

function stopConversation() {

  isRunning = false;

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (microphoneSource) {
    microphoneSource.disconnect();
    microphoneSource = null;
  }

  if (microphoneStream) {
    microphoneStream.getTracks().forEach(
      track => track.stop()
    );
    microphoneStream = null;
  }

  if (socket) {
    socket.close();
    socket = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  nextPlayTime = 0;

  startButton.disabled = false;
  stopButton.disabled = true;

  setStatus("대화가 종료되었습니다.");
}

startButton.addEventListener(
  "click",
  startConversation
);

stopButton.addEventListener(
  "click",
  stopConversation
);

</script>

</body>
</html>
